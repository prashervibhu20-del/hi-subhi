<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4e8">
  <meta name="description" content="A little pixel-perfect hello for Surbhi.">
  <title>Hi, Surbhi! ✿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
    <div class="sparkle sparkle-two" aria-hidden="true">✧</div>
    <div class="sparkle sparkle-three" aria-hidden="true">✦</div>
    <article class="hello-card" aria-label="A little greeting for Surbhi">
      <p class="eyebrow"><span class="tiny-heart" aria-hidden="true">♥</span> A LITTLE HELLO FOR YOU</p>
      <div class="smiley-wrap" aria-label="A smiling pixel face">
        <svg class="smiley" viewBox="0 0 48 48" role="img" aria-hidden="true" shape-rendering="crispEdges">
          <circle class="face-fill" cx="24" cy="24" r="20"/>
          <circle class="outline" cx="24" cy="24" r="20"/>
          <circle class="face-fill" cx="24" cy="24" r="18"/>
          <g class="open-eyes feature">
            <path d="M13 15h3v7h-3v-2h-3v-3h3zM32 15h3v2h3v3h-3v2h-3z"/>
          </g>
          <g class="closed-eyes feature"><path d="M11 18h7v2h-7zM30 18h7v2h-7z"/></g>
          <path class="feature" d="M10 28h3v3h2v3h4v2h10v-2h4v-3h2v-3h3v5h-2v3h-3v2h-4v2H19v-2h-4v-2h-3v-3h-2z"/>
        </svg>
      </div>
      <h1>Hi, <span>surbhi</span><span class="period">!</span></h1>
      <p class="note">Hope your day is as lovely as you are <span aria-hidden="true">☀</span></p>
      <div class="bottom-doodle" aria-hidden="true"><span>✿</span><span class="doodle-line"></span><span>✿</span></div>
    </article>
    <p class="footer">MADE WITH A LITTLE PIXEL LOVE</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
